services:
  - type: web
    name: raksha-ai-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: WHATSAPP_BRIDGE_URL
        value: http://localhost:3001
      - key: FASTAPI_DEBUG
        value: false
      # ── Set these in the Render dashboard (Secrets) ──
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NUMVERIFY_API_KEY
        sync: false
      - key: FASTAPI_SECRET_KEY
        generateValue: true
      - key: INTEGRATION_HMAC_SECRET
        generateValue: true
      - key: AGENCY_FEED_HMAC_SECRET
        generateValue: true
